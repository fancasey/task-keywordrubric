_ > nanoagent.plugin.v0001.ManifestConfig:
id: keyword-rubric
name: Keyword Rubric Grader
version: 0.4.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  grade_answers:
    description: Grade supplied student answers deterministically using the specified keyword rubric
  get_question:
    description: Get the question and model answer
  pin_teacher_grades:
    description: Pin the question data and its unrounded teacher mean scores for verification

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  generate-rubric:
    description: Build a deterministic keyword rubric for NQ004, NQ007, NQ008, or NQ009
    runner: agent
    tools: [get_question, grade_answers]
    reference: pin_teacher_grades
    instructions: |-
      Aim for a quick, reasonable rubric, not a perfect one. Make one pass through the model answer and submit your first valid rubric. Do not exhaustively enumerate synonyms, analyze edge cases, or revise solely to improve hypothetical grading accuracy.
      Call get_question with the task's question_id. Use the question and model answer to build a single flat list of keyword groups for the whole answer. Choose a few important concepts, usually 3 to 6 groups; do not create dimensions or try to reproduce teacher criteria.
      Keep each evidence group simple: usually 1 to 3 obvious alternatives with 1 or 2 short required phrases each. Prefer positive matches with none_of: []; add exclusions only when clearly necessary. The limits below are validation ceilings, not targets.
      The rubric has 1 to 20 equally weighted keyword groups. The overall score is 1 + 3 * (matched groups / total groups), giving partial credit from 1 to 4. Each group matches if any of its alternatives matches. Each alternative has all_of (1 to 8 required literal words or short phrases) and none_of (0 to 8 excluded phrases; use [] when there are none). It matches only when every all_of phrase occurs somewhere in the answer and no none_of phrase occurs. Phrases must be 1 to 100 normalized characters. For "A or (B and C without D)", use alternatives [{all_of: [A], none_of: []}, {all_of: [B, C], none_of: [D]}]. Exclusions apply only to their own alternative, and any excluded phrase vetoes that alternative. Do not require and exclude the same phrase. Each group has 1 to 20 alternatives; avoid duplicates across the rubric. Use common synonyms for key concepts and combine terms when a single word is ambiguous. Matching uses Unicode NFKC normalization, case folding, collapsed whitespace, and word boundaries around literal phrases. Each group counts at most once, regardless of repeated matches.
      Testing sample answers is optional; normally submit directly without calling grade_answers. If grading is needed, use grade_answers with question_id, rubric, and answers; never assign or estimate grades by hand. Make at most one small sanity-check call, then fix only concrete validity errors and submit. The tool grades only the supplied answers and does not reveal private submissions.
      Submit only the question_id and the complete rubric. The verifier applies the rubric to the private student submissions and compares each overall score with the student's mean teacher score across all criteria and evaluators.
