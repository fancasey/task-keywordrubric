_ > nanoagent.plugin.v0001.ManifestConfig:
id: keyword-rubric
name: Keyword Rubric Grader
version: 0.2.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_question:
    description: Get the question, model answer, and teacher criteria
  pin_teacher_grades:
    description: Pin the question data and its unrounded teacher mean scores for verification

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  generate-rubric:
    description: Build a deterministic keyword rubric for NQ004, NQ007, NQ008, or NQ009
    runner: agent
    tools: [get_question]
    reference: pin_teacher_grades
    instructions: |-
      Call get_question with the task's question_id. Use the question, model answer, and teacher level descriptions to build one rubric entry per dimension_id.
      Each dimension starts at 1 and has exactly three distinct evidence groups worth one point each. Each group matches if any of its alternatives matches. Each alternative has all_of (1 to 8 required literal words or short phrases) and none_of (0 to 8 excluded phrases; use [] when there are none). It matches only when every all_of phrase occurs somewhere in the answer and no none_of phrase occurs. Phrases must be 1 to 100 normalized characters. For "A or (B and C without D)", use alternatives [{all_of: [A], none_of: []}, {all_of: [B, C], none_of: [D]}]. Exclusions apply only to their own alternative, and any excluded phrase vetoes that alternative. Do not require and exclude the same phrase. Each group has 1 to 20 alternatives; avoid duplicates within a dimension. Use common synonyms for key concepts and combine terms when a single word is ambiguous. Matching uses Unicode NFKC normalization, case folding, collapsed whitespace, and word boundaries around literal phrases. Each group contributes at most one point, regardless of repeated matches.
      Submit only the question_id and the complete rubric. The verifier applies the rubric to the private student submissions and compares the resulting grades with teacher means.
